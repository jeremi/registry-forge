name: Feature request
description: Suggest an improvement to Registry Forge.
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or user need should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How should the behavior be tested or demonstrated?
    validations:
      required: false
